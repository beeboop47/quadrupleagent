<script>
/* Pure rules engine. No DOM or storage dependencies; state can be safely resumed behind a handover. */
(function(root){
  'use strict';
  const C=root.QACatalogue || (typeof require==='function'?require('./catalogue.js'):null);
  const clone=value=>JSON.parse(JSON.stringify(value));
  const lookup=(list,id)=>list.find(item=>item.id===id);
  const fail=message=>{throw new Error(message);};
  function shuffle(list,rng=Math.random){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  const active=g=>g.players.filter(p=>!p.jailed);
  const player=(g,id)=>g.players.find(p=>p.id===id);
  const hasSpecial=(p,id)=>(p.special===id||(Array.isArray(p.specials)&&p.specials.includes(id)))&&(!lookup(C.specials,id)?.teams||lookup(C.specials,id).teams.includes(p.team));
  const apparent=p=>hasSpecial(p,'suspicious')&&p.team==='force'?'parasites':hasSpecial(p,'cover')&&p.team==='parasites'?'force':p.team;
  const other=team=>team==='force'?'parasites':'force';
  function cleanConfig(raw={}){
    const cfg={...clone(C.defaults),...clone(raw)};
    for(const [key,list] of [['operations',C.operations],['agendas',C.agendas],['specials',C.specials]])cfg[key]=Array.isArray(cfg[key])?[...new Set(cfg[key].filter(id=>lookup(list,id)))]:list.map(x=>x.id);
    cfg.parasites=Math.max(1,Math.min(8,Math.floor(Number(cfg.parasites)||1)));
    cfg.parity=cfg.parity!==false;cfg.manual=cfg.manual===true;
    cfg.singleRound=cfg.singleRound===true;
    cfg.revealRoleExceptions=cfg.revealRoleExceptions===true;
    cfg.operationPhases=Math.max(1,Math.min(10,Math.floor(Number(cfg.operationPhases)||1)));
    cfg.discussionMinutes=Math.max(0,Math.min(30,Number(cfg.discussionMinutes)||0));
    cfg.assignments=cfg.assignments&&typeof cfg.assignments==='object'&&!Array.isArray(cfg.assignments)?cfg.assignments:{};
    cfg.overrides=Array.isArray(cfg.overrides)?cfg.overrides:[];
    return cfg;
  }
  function roundOverrides(config,round,players){
    if(!config.manual)return [];
    const ids=new Set(players.filter(p=>!p.jailed).map(p=>p.id));
    return config.overrides.filter(o=>Number(o.round)===round&&ids.has(o.player)&&lookup(C.operations,o.operation));
  }
  function validateRound(config,round,players){
    const overrides=roundOverrides(config,round,players);const seen=new Set();
    for(const o of overrides){if(seen.has(o.player))fail('Only one guaranteed operation per player in a round.');seen.add(o.player);}
    const pool=config.operations.filter(id=>!overrides.some(o=>o.operation===id));
    if(pool.length<players.filter(p=>!p.jailed).length-overrides.length)fail('There are not enough unique operations for every active player. Enable more operations or explicitly assign manual operations.');
    if(config.operations.includes('agenda')&&!config.agendas.length&&overrides.filter(o=>o.operation==='agenda').length===0)fail('Enable at least one Hidden Agenda, or disable that operation.');
    for(const o of overrides){
      if(o.operation==='agenda'&&!config.agendas.length&&!lookup(C.agendas,o.result))fail('A guaranteed Hidden Agenda needs an enabled or explicitly assigned agenda.');
      if(Array.isArray(o.targets)&&o.targets.includes(o.player)&&!lookup(C.operations,o.operation).allowSelf)fail('An operation cannot target its own player.');
    }
    return overrides;
  }
  function createGame(roster,raw,rng=Math.random){
    const config=cleanConfig(raw);
    if(!Array.isArray(roster)||roster.length<3||roster.length>9)fail('Use 3–9 players.');
    const names=roster.map(p=>String(p.name||'').trim());
    if(names.some(n=>!n||n.length>30))fail('Give each player a name of 1–30 characters.');
    if(new Set(names.map(n=>n.toLowerCase())).size!==names.length)fail('Each player needs a different name.');
    if(new Set(roster.map(p=>p.id)).size!==roster.length)fail('Player IDs must be unique.');
    if(config.parasites>=roster.length&&!config.manual)fail('Keep at least one starting Force player.');
    const players=roster.map(p=>({id:p.id,name:p.name.trim(),team:null,special:null,jailed:false,defector:null,agenda:null,secured:[],disqualified:false}));
    if(config.manual)for(const p of players){const a=config.assignments[p.id]||{};if(['force','parasites'].includes(a.team))p.team=a.team;if(a.special==='none'||lookup(C.specials,a.special))p.special=a.special;const role=lookup(C.specials,p.special);if(role?.teams.length===1){if(p.team&&!role.teams.includes(p.team))fail(`${role.name} can only be assigned to ${role.teams[0]==='force'?'Force':'Parasites'}.`);p.team=role.teams[0];}}
    const fixedParasites=players.filter(p=>p.team==='parasites').length;
    const unassigned=shuffle(players.filter(p=>!p.team),rng);
    // Explicitly assigned teams can exceed the normal composition. Random slots fill the remaining requested count.
    const needed=unassigned.length?Math.max(0,config.parasites-fixedParasites):0;
    if(needed>unassigned.length)fail('Starting Parasite count conflicts with the manually assigned Force players. Lower the count or free a team assignment.');
    unassigned.forEach((p,i)=>p.team=i<needed?'parasites':'force');
    // Small groups receive a random subset of enabled roles, one per player.
    // Manual roles reserve their type and player before the remaining roles are dealt.
    const pool=shuffle(config.specials.filter(id=>!players.some(p=>p.special===id)),rng),free=shuffle(players.filter(p=>p.special===null),rng);
    if(pool.length&&!free.length&&players.length>=config.specials.length)fail('An enabled special role needs an available player. Free a manual special-role assignment or disable that role.');
    // Maximum matching keeps one role per player and reserves scarce eligible team slots.
    let best=[];const goal=Math.min(pool.length,free.length);
    function deal(index,used,chosen){if(chosen.length>best.length)best=[...chosen];if(best.length===goal||index===pool.length)return;const role=lookup(C.specials,pool[index]);for(const p of free){if(!used.has(p.id)&&role.teams.includes(p.team)){used.add(p.id);chosen.push([p,role.id]);deal(index+1,used,chosen);chosen.pop();used.delete(p.id);if(best.length===goal)return;}}deal(index+1,used,chosen);}
    deal(0,new Set(),[]);for(const [p,id] of best)p.special=id;
    for(const p of players){if(p.special==='none')p.special=null;p.initialTeam=p.team;}
    validateRound(config,1,players);
    return {version:1,config,players,initialParasites:players.filter(p=>p.team==='parasites').map(p=>p.id),phase:'briefing',cursor:0,round:0,turns:[],effects:{},votes:{},voters:[],history:[],winner:null,endingReason:null};
  }
  function teamWinner(g){
    const alive=active(g);const parasites=alive.filter(p=>p.team==='parasites').length;
    if(alive.length<=2)return parasites?{team:'parasites',reason:'Two or fewer players remain, with a Parasite still active.'}:{team:'force',reason:'Every active Parasite has been removed.'};
    if(g.config.singleRound)return null;
    if(!parasites)return {team:'force',reason:'Every active Parasite has been removed.'};
    if(g.config.parity&&parasites>=alive.length-parasites)return {team:'parasites',reason:'Parasites equal or outnumber the active Force.'};
    return null;
  }
  function checkEnd(g){const end=teamWinner(g);if(end){g.winner=end.team;g.endingReason=end.reason;g.phase='ended';return true;}return false;}
  function finishBriefing(g){if(g.phase!=='briefing')fail('Briefing is not active.');g.phase='round-ready';g.cursor=0;checkEnd(g);}
  function startRound(g,rng=Math.random){
    if(g.winner)fail('The game has already ended.');
    const continuation=g.phase==='discussion';
    const phases=g.config.operationPhases||1;
    if(continuation&&(g.operationCycle||1)>=phases)fail('All operation phases are complete. Begin voting.');
    if(!['round-ready','results','discussion'].includes(g.phase))fail('Finish the current round first.');
    if(checkEnd(g))return;
    const alive=active(g);const round=g.round+1;const overrides=validateRound(g.config,round,alive);
    const pool=shuffle(g.config.operations.filter(id=>!overrides.some(o=>o.operation===id)),rng);
    const turns=alive.map(p=>{const override=overrides.find(o=>o.player===p.id);return {player:p.id,operation:override?override.operation:pool.pop(),override:override?clone(override):null,targets:null,result:null,done:false};});
    g.operationCycle=continuation?(g.operationCycle||1)+1:1;
    g.votingRound=continuation?(g.votingRound||1):(g.votingRound||0)+1;
    if(!continuation){g.effects={};g.publicOperations=[];}
    g.publicOperations=g.publicOperations||[];
    g.publicOperations.push({cycle:g.operationCycle,turns:turns.map(t=>({player:t.player,operation:t.operation}))});
    g.round=round;g.phase='operations';g.cursor=0;g.turns=turns;g.votes={};g.voters=[];g.tally=null;
  }
  function resolveTargets(g,actor,count,requested=[],rng=Math.random,allowSelf=false){
    const eligible=active(g).filter(p=>allowSelf||p.id!==actor).map(p=>p.id);
    const chosen=[...new Set((Array.isArray(requested)?requested:[]).filter(id=>eligible.includes(id)))].slice(0,count);
    chosen.push(...shuffle(eligible.filter(id=>!chosen.includes(id)),rng).slice(0,count-chosen.length));
    if(chosen.length<count)fail('There are not enough active targets for this operation.');
    return chosen;
  }
  function prepareTurn(g,index=g.cursor,rng=Math.random){
    if(g.phase!=='operations'||index!==g.cursor)fail('This operation is not the current turn.');
    const turn=g.turns[index];const op=lookup(C.operations,turn.operation);
    if(turn.targets===null&&(op.kind==='random'||(turn.override&&turn.override.targets&&turn.override.targets.length)))turn.targets=resolveTargets(g,turn.player,op.targets,turn.override?.targets,rng,op.allowSelf);
    return turn;
  }
  function switchTeam(p,team,asDefector=false){
    if(p.team===team)return;
    p.team=team;p.defector=asDefector?team:null;
  }
  function runOperation(g,{targets=[],choice=null}={},rng=Math.random){
    const turn=prepareTurn(g,g.cursor,rng);if(turn.done)fail('This operation is already complete.');
    const op=lookup(C.operations,turn.operation);const p=player(g,turn.player);
    const forced=turn.override?.result??null;
    const picked=turn.targets!==null?turn.targets:resolveTargets(g,p.id,op.targets,targets,rng,op.allowSelf);
    if(op.kind==='choose'&&turn.targets===null&&(!Array.isArray(targets)||targets.length!==op.targets||new Set(targets).size!==targets.length||targets.some(id=>!active(g).some(t=>t.id===id&&(op.allowSelf||id!==p.id)))))fail(`Choose ${op.targets} different active player${op.targets===1?'':'s'}.`);
    turn.targets=picked;const people=picked.map(id=>player(g,id));let result;

    const invert=answer=>hasSpecial(p,'source')?!answer:answer;
    switch(op.id){
      case 'tip':{
        const natural=seenTeam(people[0]);
        result={type:'intel',team:['force','parasites'].includes(forced)?forced:hasSpecial(p,'source')?other(natural):natural,targets:picked};break;
      }
      case 'confession':result={type:'confession',team:['force','parasites'].includes(forced)?forced:p.team,targets:picked};break;
      case 'intel':case 'encounter':{
        const group=op.id==='encounter'?[p,...people]:people;
        result={type:'presence',parasite:['yes','no'].includes(forced)?forced==='yes':invert(group.some(t=>seenTeam(t)==='parasites')),targets:picked};break;
      }
      case 'danish':result={type:'match',same:['same','different'].includes(forced)?forced==='same':invert(seenTeam(people[0])===seenTeam(people[1])),targets:picked};break;
      case 'majority':{
        const natural=people.filter(t=>seenTeam(t)==='parasites').length>=2?'parasites':'force';
        result={type:'majority',team:['force','parasites'].includes(forced)?forced:hasSpecial(p,'source')?other(natural):natural,targets:picked};break;
      }
      case 'chain':result={type:'match',same:['same','different'].includes(forced)?forced==='same':invert(seenTeam(p)===seenTeam(people[0])),targets:[p.id,...picked]};break;
      case 'threat':result={type:'threat',opposing:['yes','no'].includes(forced)?forced==='yes':invert(people.some(t=>seenTeam(t)!==p.team)),targets:picked};break;
      case 'cross':{
        const eligible=active(g).filter(t=>t.id!==p.id&&t.id!==picked[0]);
        const extra=eligible.find(t=>t.id===turn.override?.targets?.[1])||shuffle(eligible,rng)[0];if(!extra)fail('Cross-Reference needs a third active player.');
        result={type:'match',same:['same','different'].includes(forced)?forced==='same':invert(seenTeam(people[0])===seenTeam(extra)),targets:[...picked,extra.id]};break;
      }
      case 'audit':{
        const alive=active(g),natural=alive.filter(t=>seenTeam(t)==='parasites').length;
        const count=forced!==null&&/^\d+$/.test(String(forced))?Number(forced):hasSpecial(p,'source')?alive.length-natural:natural;
        if(count>alive.length)fail('Internal Audit count cannot exceed the active player count.');
        result={type:'audit',count,total:alive.length,targets:[]};break;
      }
      case 'background':{
        const target=people[0],actual=lookup(C.specials,target.special)?.id||null;
        const randomRole=()=>shuffle(C.specials.filter(role=>role.teams.includes(target.team)),rng)[0]?.id||'source';
        let reported=hasSpecial(p,'source')?(actual?null:randomRole()):actual;
        if(lookup(C.specials,forced))reported=forced;else if(['none','no'].includes(forced))reported=null;else if(forced==='yes')reported=actual||randomRole();
        result={type:'fact',fact:'background',answer:!!reported,special:reported,targets:picked};break;
      }
      case 'loyalties':{
        const target=people[0];const natural=op.id==='background'?!!target.special||!!target.specials?.length:!!target.agenda||!!target.secured?.length;
        result={type:'fact',fact:op.id,answer:['yes','no'].includes(forced)?forced==='yes':invert(natural),targets:picked};break;
      }
      case 'personnel':{
        const target=people[0],facts=[{key:'team',positive:'They are Force.',negative:'They are a Parasite.',truth:seenTeam(target)==='force'},{key:'special',positive:'They have a hidden special role.',negative:'They have no hidden special role.',truth:!!target.special||!!target.specials?.length},{key:'agenda',positive:'They have a personal victory condition or secured personal win.',negative:'They follow their team’s usual victory condition.',truth:!!target.agenda||!!target.secured?.length}];
        const selected=shuffle(facts,rng).slice(0,2);const corrupted=forced==='false'||hasSpecial(p,'source')&&!['normal','true'].includes(forced);
        const statements=selected.map((fact,i)=>{const truthful=forced==='true'||!corrupted&&i===0;return truthful===fact.truth?fact.positive:fact.negative;});
        result={type:'personnel',statements:shuffle(statements,rng),targets:picked};break;
      }
      case 'evidence':{
        const effect=['shield','double'].includes(forced)?forced:choice;
        if(!['shield','double'].includes(effect))fail('Choose protection or a double vote.');
        const entry=g.effects[picked[0]]||(g.effects[picked[0]]={shield:0,double:0});entry[effect]++;

      }
      case 'defector':{
        const decision=['switch','stay'].includes(forced)?forced:choice;

        if(decision==='switch')switchTeam(p,other(p.team),true);

  }
  function finishTurn(g){
    if(g.phase!=='operations'||!g.turns[g.cursor]?.done)fail('Complete the operation before passing the phone.');
    g.cursor++;if(g.cursor>=g.turns.length){g.phase='discussion';g.cursor=0;checkEnd(g);}
  }
  function startVoting(g){
    if(g.phase!=='discussion')fail('Voting follows discussion.');
    if((g.operationCycle||1)<(g.config.operationPhases||1))fail('Complete all operation phases before voting.');
    g.voters=active(g).filter(p=>!(p.team==='force'&&p.defector==='force')).map(p=>p.id);g.cursor=0;g.phase='voting';
    if(!g.voters.length)resolveVotes(g);

  function vote(g,target){
    if(g.phase!=='voting')fail('Voting is not active.');
    const voter=g.voters[g.cursor];if(!voter)fail('There is no voter on this turn.');

      if(p.disqualified)status.set(p.id,{win:false,reason:'A Parasite teammate voted for this Parasite Defector.'});
      else if(p.secured.length)status.set(p.id,{win:true,reason:`Personal win secured: ${lookup(C.agendas,p.secured[0].id).name}.`});

/* Native looping preserves the supplied track's own fade. Web Audio handles iPhone volume. */
(function(root){
  'use strict';
  function create({src='Background Music.mp3',volume=.28,onChange=()=>{},onError=()=>{}}={}){
    let context=null,gain=null,audio=null,enabled=false,pending=false,generation=0;
    function report(){onChange({enabled,volume,playing:enabled&&!!audio&&!audio.paused,loading:pending});}
    function init(){
      if(audio)return;
      const AC=root.AudioContext||root.webkitAudioContext;
      audio=new Audio();audio.preload='metadata';audio.loop=true;audio.src=src;audio.setAttribute('playsinline','');
      // Local-file media can be blocked by Web Audio origin checks; native audio keeps it audible.
      if(AC&&root.location?.protocol!=='file:'){
        context=new AC();gain=context.createGain();gain.gain.value=volume;gain.connect(context.destination);
        context.createMediaElementSource(audio).connect(gain);context.addEventListener('statechange',report);
      }else audio.volume=volume;
      audio.addEventListener('error',()=>{if(enabled){stop();onError('Music could not load. Keep Background Music.mp3 beside the HTML file.');}});
    }
    async function start(){
      if(enabled)return;let token=null;
      try{
        init();enabled=true;token=++generation;pending=true;report();
        // Both calls happen inside the user's gesture to unlock iPhone playback.
        const resume=context?context.resume():Promise.resolve(),play=audio.play();await Promise.all([resume,play]);
        if(!enabled||token!==generation)return;pending=false;report();
      }catch(error){
        if(token!==null&&token!==generation)return;
        stop();onError('Tap Music to play the background track. Check that Background Music.mp3 is beside the HTML.');
      }
    }
    function stop(){enabled=false;generation++;pending=false;if(audio)audio.pause();if(context?.state==='running')void context.suspend();report();}
    function setVolume(value){volume=Math.min(1,Math.max(0,Number(value)||0));if(gain)gain.gain.setTargetAtTime(volume,context.currentTime,.05);else if(audio)audio.volume=volume;report();}
    function dispose(){stop();if(audio){audio.removeAttribute('src');audio.load();}if(context)void context.close();}
    return {start,stop,setVolume,dispose,getState:()=>({enabled,volume})};
  }
  const api={create};root.QAMusic=api;if(typeof module!=='undefined'&&module.exports)module.exports=api;
})(globalThis);

</script>

      body+=`<div class="presets"><button class="preset ${effect==='shield'?'selected':''}" data-action="choice" data-choice="shield" ${forced?'disabled':''}><b>Shield</b><span>Subtract 1 vote against them</span></button><button class="preset ${effect==='double'?'selected':''}" data-action="choice" data-choice="double" ${forced?'disabled':''}><b>Double vote</b><span>Their own vote counts as 2</span></button></div>`;
    }
    if(op.id==='defector'){
      const decision=['switch','stay'].includes(forced)?forced:choice;
      body+=`<div class="notice">Force Defectors cannot vote while Force. Parasite Defectors permanently lose if any current Parasite votes for them. Other players will not be told.</div><div class="presets"><button class="preset ${decision==='stay'?'selected':''}" data-action="choice" data-choice="stay" ${forced?'disabled':''}><b>Stay</b><span>Keep your current allegiance</span></button><button class="preset ${decision==='switch'?'selected':''}" data-action="choice" data-choice="switch" ${forced?'disabled':''}><b>Defect</b><span>Switch to the other team</span></button></div>`;
    }
    if(op.id==='encounter')body+=`<div class="notice">Your partner: <strong>${esc(E.player(game,turn.targets[0]).name)}</strong>. Both of you must read the result together.</div>`;
    const ready=(op.kind!=='choose'||fixed||selected.length===op.targets)&&(!['evidence','defector'].includes(op.id)||choice||forced);
    body+=errorBlock()+button(op.id==='encounter'?'Invite partner & conceal':op.id==='confession'?'Conceal for confession':'Complete operation','operate','btn wide',ready?'':'disabled');return body;
  }
  function operationResult(turn){
    const r=turn.result,p=E.player(game,turn.player),op=find(C.operations,turn.operation),names=(r.targets||[]).map(id=>E.player(game,id).name);let headline='',detail='';
    switch(r.type){
      case 'intel':headline=teamName(r.team);detail=`${esc(names[0])} appears to belong to the ${r.team==='force'?'Force':'Parasites'}.`;break;
      case 'confession':headline=`${esc(p.name)} is ${r.team==='force'?'Force':'a Parasite'}.`;detail=`${esc(names[0])}, this is ${esc(p.name)}’s actual allegiance.`;break;
      case 'presence':headline=r.parasite?'A Parasite is present.':'No Parasite detected.';detail=`${turn.operation==='encounter'?[p.name,...names].map(esc).join(' and '):names.map(esc).join(' and ')}: ${r.parasite?'at least one appears to be a Parasite.':'both appear to be Force.'}`;break;
      case 'match':headline=r.same?'Same team.':'Different teams.';detail=`${names.map(esc).join(' and ')} appear to work for ${r.same?'the same team':'different teams'}.`;break;
      case 'majority':headline=teamName(r.team)+' majority.';detail=`Among ${names.map(esc).join(', ')}, at least two appear to work for the ${r.team==='force'?'Force':'Parasites'}.`;break;
      case 'threat':headline=r.opposing?'Opposing team detected.':'No opposing team detected.';detail=`${names.map(esc).join(' and ')}: ${r.opposing?'at least one appears to oppose your current team.':'neither appears to oppose your current team.'}`;break;
      case 'audit':headline=`${r.count} apparent Parasite${r.count===1?'':'s'}.`;detail=`Out of ${r.total} active players. This reveals no identities.`;break;
      case 'fact':if(r.fact==='background'){const role=find(C.specials,r.special);headline=role?role.name:'No special role detected.';detail=esc(names[0])+(role?' has the special role <strong>'+esc(role.name)+'</strong>.':' has no special role.');}else{headline=r.answer?'Personal victory condition detected.':'Normal team victory condition.';detail=esc(names[0])+': '+(r.answer?'has a personal victory condition or secured personal win. Its details remain concealed.':'follows their team’s usual victory condition.');}break;
      case 'personnel':headline='One statement is true.';detail=`File: <strong>${esc(names[0])}</strong><ol>${r.statements.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>Hidden information modifiers can interfere with this guarantee.`;break;
      case 'evidence':headline=r.effect==='shield'?'One vote of protection.':'A vote with double effect.';detail=r.effect==='shield'?`One vote will be subtracted from ${esc(names[0])}’s total this round.`:`${esc(names[0])}’s own vote counts as two this round.`;break;
      case 'defector':headline=r.switched?`You are now ${r.team==='force'?'Force':'a Parasite'}.`:'Allegiance unchanged.';detail=r.switched?(r.team==='force'?'You are a Force Defector. You cannot vote while you remain Force.':'You are a Parasite Defector. If any current Parasite votes for you, you permanently lose.'):'You chose to stay on your current team.';break;
      case 'transfer':headline='Transfer complete.';detail=`Your team was swapped with ${esc(names[0])}’s. Neither allegiance is disclosed. If both teams matched, no allegiance changed.`;break;
      case 'agenda':{
        const agenda=find(C.agendas,r.agenda);headline=agenda.name;
        if(r.agenda==='sleeper')detail=`You immediately switched teams. You are now <strong>${teamName(r.team)}</strong>, and your new team determines your victory.`;
        else if(r.agenda==='scapegoat')detail='Your new goal: get jailed in a vote. This secures your personal win immediately, regardless of your team.';
        else if(r.agenda==='grudge')detail=`Your target is <strong>${esc(E.player(game,r.target).name)}</strong>. Secure your personal win when they are jailed, regardless of your team.`;
        else detail=`You share <strong>${esc(E.player(game,r.target).name)}</strong>’s personal victory or loss, regardless of either player’s allegiance.`;
        if(p.secured.length)detail+='<br>Your earlier secured personal win is retained.';
        break;
      }
    }
    return `<div class="eyebrow">${op.name} / Eyes only</div><h1>Intelligence received.</h1><div class="secret"><div class="micro muted">${icon(op.id)} ${esc(p.name)}${['confession','encounter'].includes(turn.operation)?' & '+names.map(esc).join(', '):''}</div><div class="big-result">${headline}</div><p>${detail}</p></div>${['intel','presence','match'].includes(r.type)?'<p class="small muted">Hidden special roles can alter information. Results reflect the moment this operation was completed.</p>':''}${r.type==='agenda'&&r.agenda!=='sleeper'?'<p class="small muted">This replaces your personal victory condition. Your allegiance still determines team counts and intel. A later Hidden Agenda replaces an unfinished one.</p>':''}${button('Conceal & pass','op-next')}`;
  }
  function discussion(){
    return `<div class="eyebrow">Discussion / Everyone may look</div><h1>Compare stories.<br>Question everything.</h1><p class="muted">Share what you learned, or tell a convincing lie. Decide who should be jailed.</p><div class="panel center"><div class="micro muted">Discussion timer · optional</div><div class="timer" id="timer">${timerText()}</div><div class="row" style="justify-content:center">${button(game.timer?.running?'Pause':'Start','timer-toggle','pill')}${button('Reset','timer-reset','pill')}</div></div><div class="public-roster">${E.active(game).map(p=>`<span>${esc(p.name)}</span>`).join('')}</div><p class="small muted">Votes are private. Ties jail nobody. No self-votes. A jailed player’s actual allegiance is revealed.</p>${(game.operationCycle||1)<(game.config.operationPhases||1)?`<p class="notice">Operation cycle ${game.operationCycle||1} of ${game.config.operationPhases}. Everyone receives another operation before voting.</p>${errorBlock()}${button('Next operation cycle','round-start','btn wide launch')}`:button('Begin private voting','voting-start','btn wide launch')}`;
  }

  function results(){
    const tally=game.tally,jailed=tally.jailed?E.player(game,tally.jailed):null;
    return `<div class="eyebrow">Round ${game.votingRound||game.round} / Anonymous results</div><h1>${jailed?esc(jailed.name)+' is jailed.':tally.tie?'A tie. Nobody jailed.':'Nobody is jailed.'}</h1>${jailed?`<div class="notice"><span class="chip ${tally.reveal}">${teamName(tally.reveal).toUpperCase()}</span> <span style="margin-left:8px">Actual allegiance revealed</span></div>`:'<p class="muted">'+(tally.tie?'The highest total was shared.':'No player received a positive final total.')+'</p>'}<div class="panel"><div class="panel-title"><h3>Final vote totals</h3><span class="count">ROUND ${game.votingRound||game.round}</span></div>${Object.entries(tally.totals).sort((a,b)=>b[1]-a[1]).map(([id,total])=>`<div class="results-row"><span class="name">${esc(E.player(game,id).name)}${id===tally.jailed?' <span class="red small">JAILED</span>':''}</span><span class="vote-total">${total}</span></div>`).join('')}<p class="small muted" style="margin:18px 0 0">Double votes and protection are included. Voter identities remain concealed.</p></div>${game.winner?`<div class="notice">The game has ended. ${esc(game.endingReason)}</div>${button('Reveal final outcomes','final-results','btn wide launch')}`:`<p class="muted small" style="margin:20px 0">${E.active(game).length} players remain. Any personal wins stay secret until the game ends.</p>${errorBlock()}${button('Next round','round-start','btn wide launch')}`}`;
  }
  function ended(){const outcomes=E.outcomes(game);return `<div class="eyebrow">Case closed / Everyone may look</div><h1 class="${game.winner==='force'?'blue':'red'}">${game.winner==='draw'?'No team wins.':teamName(game.winner)+' win.'}</h1><p class="muted">${esc(game.endingReason)}</p><div class="notice">Personal agendas can give players a different result from their team.</div>${outcomes.map(p=>`<div class="result-detail"><div class="row between"><h3 style="margin:0">${esc(p.name)}</h3><span class="chip ${p.win?'force':'parasites'}">${p.draw?'DRAW':p.win?'WIN':'LOSS'}</span></div><p class="small muted" style="margin:8px 0">${teamName(p.team)}${p.jailed?' · Jailed':''}${p.agenda?' · '+find(C.agendas,p.agenda.id).name:''}${p.defector?' · '+teamName(p.defector)+' Defector':''}</p>${p.special&&find(C.specials,p.special)?`<p class="small" style="margin:8px 0">Special role: <strong>${esc(find(C.specials,p.special).name)}</strong></p>`:'' }${p.agenda&&['infatuation','grudge'].includes(p.agenda.id)?`<p class="small" style="margin:8px 0">${p.agenda.id==='infatuation'?'Infatuation':'Grudge'} target: <strong>${esc(E.player(game,p.agenda.target)?.name||'Unknown agent')}</strong></p>`:''}<p class="small">${esc(p.reason)}</p></div>`).join('')}${button('Play again','play-again','btn wide launch')}`;}
  function render(){
    $('settings-button').innerHTML=icon('settings')+' '+(view==='setup'?'Settings':'Controls');
    if(view==='setup'){main.innerHTML=setup();return;}
    const owner=game.phase==='briefing'?game.players[game.cursor]:game.phase==='operations'?E.player(game,game.turns[game.cursor]?.player):game.phase==='voting'?E.player(game,game.voters[game.cursor]):null; const known=game.config.revealRoleExceptions&&revealed&&owner&&['fixed','counterintel'].includes(owner.special)?find(C.specials,owner.special):null;
    const fn={briefing, 'round-ready':roundReady,operations,discussion,voting,results,ended}[game.phase];
    const publicOps=game.turns.length&&['operations','discussion','voting','results'].includes(game.phase)?`<details class="panel" style="padding:14px 18px;margin-bottom:24px"><summary>Public operations · Round ${game.votingRound||game.round}</summary><p class="small muted" style="margin:12px 0">Operation assignments are public. Results and targets stay private.</p>${(game.publicOperations||[{cycle:1,turns:game.turns}]).flatMap(phase=>phase.turns.map(t=>({...t,cycle:phase.cycle}))).map(t=>`<div class="results-row small"><span class="name">${esc(E.player(game,t.player).name)} · Cycle ${t.cycle}</span><strong>${find(C.operations,t.operation).name}</strong></div>`).join('')}</details>`:'';
    main.innerHTML=`<section class="game-view">${['briefing','ended'].includes(game.phase)?'':phaseStrip()}${publicOps}${known?`<div class="result-detail"><h3>Your special role: ${known.name}</h3><p class="small muted">${known.description}</p></div>`:''}${fn?fn():'<p>Unable to resume this game.</p>'}</section>`;
  }
  function openModal(title,html,mode){modalMode=mode;$('modal-title').textContent=title;$('modal-body').innerHTML=html;if(!modal.open)modal.showModal();}
  function closeModal(){modal.close();error='';}
  function settings(tab='config'){
    modalTab=tab;
    if(view==='playing'){resetPrivate();render();openModal('Game controls',`<p class="muted">The current game is saved on this browser. Returning to setup keeps it available to resume.</p>${game.config.manual&&['round-ready','results'].includes(game.phase)&&!game.winner?button('Edit upcoming round overrides','game-overrides','btn secondary wide'):''}${button('Return to setup','leave','btn secondary wide launch')}${button('Conceal screen','conceal','btn wide launch')}`,'controls');return;}
    const tabs=`<div class="tabbar" role="tablist">${[['config','Rules'],['manual','Manual mode'],['presets','Saved presets']].map(([id,label])=>`<button role="tab" aria-selected="${tab===id}" class="${tab===id?'active':''}" data-action="settings-tab" data-tab="${id}">${label}</button>`).join('')}</div>`;
    let body=tab==='config'?configForm():tab==='manual'?manualForm(config,roster,false):presetsForm();

  function checklist(list,key){return list.map(item=>`<div class="check-row"><input type="checkbox" id="toggle-${item.id}" data-list="${key}" data-id="${item.id}" ${config[key].includes(item.id)?'checked':''}><label for="toggle-${item.id}">${item.name}<p>${item.description}</p></label></div>`).join('');}
  function configForm(){return `<label>Operation phases before voting<input type="number" min="1" max="10" data-config="operationPhases" value="${config.operationPhases||1}"></label><p class="small muted" style="margin:8px 0 20px">One fresh operation per player in each cycle, with discussion between cycles. Voting effects carry through to the vote.</p><div class="check-row"><input type="checkbox" id="single-round" data-config="singleRound" ${config.singleRound?'checked':''}><label for="single-round">End after one voting round<p>Jail Force: Parasites win. Jail a Parasite: Force win. If nobody is jailed, neither team wins. Parity does not end the game before voting.</p></label></div><div class="check-row"><input type="checkbox" id="parity" data-config="parity" ${config.parity?'checked':''}><label for="parity">Parasite parity victory<p>End when active Parasites equal or outnumber the Force.</p></label></div><div class="notice">Always ends at two active players. Any remaining Parasite gives the Parasites the team victory. No remaining Parasites gives the Force victory.</div><label>Discussion timer (minutes, 0 to disable)<input type="number" min="0" max="30" data-config="discussionMinutes" value="${config.discussionMinutes}"></label><hr class="divider"><h3>Operations</h3><p class="small muted">One unique operation per active player. Enable enough for your group.</p>${checklist(C.operations,'operations')}<hr class="divider"><h3>Hidden Agenda outcomes</h3><p class="small muted">A new agenda replaces that player’s unfinished condition. Secured personal wins are retained.</p>${checklist(C.agendas,'agendas')}<hr class="divider"><h3>Special roles</h3><p class="small muted">Special roles are off by default. Roles are assigned only to eligible teams, one per player. Smaller groups receive a random subset; roles without an eligible player are left out. Roles stay hidden unless the exception below is enabled. Explicit manual assignments can exceed this limit.</p><div class="check-row"><input type="checkbox" id="known-specials" data-config="revealRoleExceptions" ${config.revealRoleExceptions?'checked':''}><label for="known-specials">Tell Fixed Assets and Counterintelligence Officers their role<p>These two roles are shown privately to their owners. Other roles stay hidden.</p></label></div>${checklist(C.specials,'specials')}`;}
  function resultOptions(operation){
    if(operation==='background')return [{id:'none',name:'No special role'},...C.specials];
    if(operation==='majority')return [{id:'force',name:'Force majority'},{id:'parasites',name:'Parasite majority'}];
    if(['threat','loyalties'].includes(operation))return [{id:'yes',name:'Yes'},{id:'no',name:'No'}];
    if(['chain','cross'].includes(operation))return [{id:'same',name:'Same team'},{id:'different',name:'Different teams'}];
    if(operation==='audit')return Array.from({length:10},(_,n)=>({id:String(n),name:`${n} apparent Parasites`}));
    if(operation==='personnel')return [{id:'normal',name:'Exactly one true statement'},{id:'false',name:'Both statements false'},{id:'true',name:'Both statements true'}];
    if(['tip','confession'].includes(operation))return [{id:'force',name:'Force'},{id:'parasites',name:'Parasites'}];
    if(['intel','encounter'].includes(operation))return [{id:'yes',name:'Parasite present'},{id:'no',name:'No Parasite detected'}];
    if(operation==='danish')return [{id:'same',name:'Same team'},{id:'different',name:'Different teams'}];
    if(operation==='agenda')return C.agendas;
    if(operation==='evidence')return [{id:'shield',name:'Subtract one vote'},{id:'double',name:'Double their own vote'}];
    if(operation==='defector')return [{id:'stay',name:'Stay'},{id:'switch',name:'Switch teams'}];
    return [];
  }
  function manualForm(cfg,people,duringGame){

    if(!cfg.manual)return body+'<div class="notice">Enable manual mode to assign teams, special roles, operations and results.</div>';
    body+=`<div class="notice">These assignments are private. Set them before the group looks at the screen. Explicit assignments can use disabled content or exceed normal limits.</div>`;
    if(!duringGame){body+='<h3>Starting assignments</h3>';for(const p of people){const a=cfg.assignments[p.id]||{};body+=`<div class="override"><h3>${esc(p.name)}</h3><div class="field-grid"><label>Allegiance<select data-assignment="team" data-id="${esc(p.id)}">${options([{id:'force',name:'Force'},{id:'parasites',name:'Parasites'}],a.team)}</select></label><label>Special role<select data-assignment="special" data-id="${esc(p.id)}">${options([{id:'none',name:'No special role'},...C.specials],a.special)}</select></label></div></div>`;}}
    body+=`<hr class="divider"><div class="panel-title"><h3>Guaranteed operations</h3><span class="count">${cfg.overrides.length}</span></div><p class="small muted">Choose a numbered operation cycle and player. Cycle numbers run continuously across voting rounds. Random targets and results stay available. If the player is jailed, the whole assignment is skipped.</p>`;
    if(!cfg.overrides.length)body+='<div class="empty">No overrides. Operations stay random.</div>';
    cfg.overrides.forEach((o,index)=>{
      const op=find(C.operations,o.operation);const targetCount=op?.id==='agenda'?(['grudge','infatuation'].includes(o.result)?1:0):op?.id==='cross'?2:op?.targets||0;
      const candidates=people.filter(p=>op?.allowSelf||p.id!==o.player).map(p=>({id:p.id,name:p.name+(p.jailed?' (jailed → random replacement)':'')}));
      const choices=resultOptions(o.operation);
      body+=`<div class="override"><button class="remove" data-action="override-remove" data-index="${index}" aria-label="Remove override ${index+1}">×</button><h3>Override ${index+1}</h3><div class="field-grid"><label>Operation cycle<input type="number" min="${duringGame?game.round+1:1}" max="999" data-override="round" data-index="${index}" value="${Number(o.round)||1}"></label><label>Player<select data-override="player" data-index="${index}">${people.map(p=>`<option value="${esc(p.id)}" ${o.player===p.id?'selected':''}>${esc(p.name)}${p.jailed?' (jailed)':''}</option>`).join('')}</select></label><label class="full">Operation<select data-override="operation" data-index="${index}">${C.operations.map(p=>`<option value="${p.id}" ${p.id===o.operation?'selected':''}>${p.name}</option>`).join('')}</select></label>${choices.length?`<label class="full">Guaranteed ${['evidence','defector'].includes(o.operation)?'decision':'result'}<select data-override="result" data-index="${index}">${options(choices,o.result,['evidence','defector'].includes(o.operation)?'Player chooses':'Natural / random result')}</select></label>`:''}${Array.from({length:targetCount},(_,t)=>`<label class="${targetCount===1?'full':''}">Target ${targetCount===1?'':t+1}<select data-override="target${t}" data-index="${index}">${options(candidates,o.targets?.[t],'Random active player')}</select></label>`).join('')}</div></div>`;
    });
    body+=button('+ Add operation override','override-add','btn secondary wide');return body;
  }
  let overridesDraft=null;
  function gameOverrides(){
    if(!game.config.manual||!['round-ready','results'].includes(game.phase)||game.winner)throw new Error('Round overrides are only editable between rounds.');

  function presetsForm(){return `<h3>Default presets</h3>${C.presets.map(p=>`<div class="setting-row"><div><strong>${p.name}</strong><p class="small muted" style="margin:4px 0 0">${p.id==='full'?'All operations, agendas and special roles.':'No special roles, Defector, Sleeper Agent or Spy Transfer.'}</p></div>${button('Load','preset','pill',`data-id="${p.id}"`)}</div>`).join('')}<hr class="divider"><h3>Your saved configurations</h3><p class="small muted">Includes players, rules, starting assignments and round overrides. Saved on this browser.</p>${customs.length?customs.map(p=>`<div class="setting-row"><strong>${esc(p.name)}</strong><div class="row">${button('Load','load-custom','pill',`data-id="${esc(p.id)}"`)}${button('Delete','delete-custom','pill',`data-id="${esc(p.id)}"`)}</div></div>`).join(''):'<div class="empty">No saved configurations yet.</div>'}<label style="margin-top:20px">Configuration name<input id="preset-name" placeholder="Friday night" maxlength="40" autocomplete="off"></label>${button('Save current configuration','save-custom','btn wide launch')}<hr class="divider"><h3>Take your config with you</h3><p class="small muted">Export a file to back up your settings or import them on another device.</p><div class="sides">${button('Export config','export','btn secondary')}${button('Import config','import','btn secondary')}</div><input type="file" id="config-file" accept="application/json,.json" hidden>`;}
  function help(){
    const intro=`<h3>One phone, private turns</h3><p class="muted">3–9 players. Brief everyone privately. Each voting round has the configured number of Operations and Discussion cycles, then Voting. Every active player receives one fresh operation in each cycle. Vote effects carry across cycles until voting, and public operation assignments remain visible. Conceal before passing. Players may lie about their information.</p><h3>Teams & voting</h3><p class="muted">Starting Parasites recognise each other once. Team changes stay secret. Force Defectors cannot vote while Force. No self-votes. Highest final total is jailed and reveals actual allegiance; ties jail nobody. A jailed player stops taking turns.</p><p class="muted">The Force wins when no active Parasites remain. Parasites win at equal or greater numbers if parity victory is enabled. At two active players the game always ends: any Parasite means a Parasite victory. Normally, team victory is checked after setup, after all operations, and after voting. With End after one voting round enabled, parity and eliminating all Parasites do not end the game before voting. Jailing Force gives the Parasites victory; jailing a Parasite gives the Force victory, even if other Parasites remain. If nobody is jailed, neither team wins.</p>`;
    openModal('Field guide',intro+`<h3 style="margin-top:28px">Operations</h3>${C.operations.map(o=>`<div class="help-entry"><h3>${o.name}</h3><p>${o.description}</p></div>`).join('')}<hr class="divider"><h3>Personal agendas</h3>${C.agendas.map(a=>`<div class="help-entry"><h3>${a.name}</h3><p>${a.description}</p></div>`).join('')}<div class="notice">A later Hidden Agenda replaces an unfinished agenda. A secured Scapegoat or Grudge win is retained. A Parasite Defector’s teammate-vote loss overrides every personal win. Secured personal wins stay private until the final reveal.</div><p class="small muted">Infatuation follows the target’s personal outcome, including their own agenda. If Infatuation forms a closed loop, each player in the loop uses their final team outcome; anyone following them shares that outcome.</p><hr class="divider"><h3>Special roles</h3>${C.specials.map(s=>`<div class="help-entry"><h3>${s.name}</h3><p>${s.description}</p></div>`).join('')}<p class="small muted" style="margin-top:16px">Confession reveals actual allegiance. Other information uses apparent allegiance. Special roles stay attached through team changes, but only operate on eligible teams. Suspicious Agent and Counterintelligence Officer are Force-only; Deep Cover Agent is Parasites-only. Unreliable Source and Fixed Asset work on either team. Background Check reveals an assigned role by name. The optional owner-awareness setting reveals only Fixed Asset and Counterintelligence Officer privately. With enough players, enabled roles are guaranteed; otherwise a random subset is dealt. All are off in the default setup. Shared Encounter results follow the operation owner’s modifiers. Manual guaranteed answers take precedence. Defector restrictions clear if an operation later changes that player’s team.</p><h3>Manual mode</h3><p class="small muted">Explicit assignments may exceed normal limits; random assignments never create a second copy of a manually assigned special role. Explicitly duplicated operations are allowed, but randomly dealt operations stay unique. Manual result overrides can deliberately alter reported intel. Protection stacks by subtracting one per use, with a minimum total of zero. A double vote always counts as two, even with repeated bonuses.</p><p class="small muted">At least two other active players are required for two-target intel. Jailed operation owners are skipped. Unavailable or duplicated targets are replaced with eligible active players. Unfilled targets are chosen randomly. Guaranteed results are preserved.</p><div class="modal-foot">${button('Understood','close-modal')}</div>`,'help');
  }
  function applyPreset(id){const p=find(C.presets,id);if(!p)return;config=E.cleanConfig(p.config);config.parasites=Math.min(config.parasites,roster.length-1);presetId=id;error='';persist();render();if(modal.open&&modalMode==='settings')settings(modalTab);toast(p.name+' preset loaded');}
  function newGame(){game=E.createGame(roster,config);view='playing';resetPrivate();persist();render();window.scrollTo(0,0);}
  function setTimer(){game.timer={remaining:game.config.discussionMinutes*60,running:false,deadline:null};}
  function remainingTime(){return game?.timer?.running?Math.max(0,Math.ceil((game.timer.deadline-Date.now())/1000)):game?.timer?.remaining||0;}
  function timerText(){const seconds=remainingTime();return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;}
  function privateAdvance(){resetPrivate();persist();render();window.scrollTo(0,0);}
  function runAction(action,b){
    switch(action){
      case 'add':if(roster.length<9){let n=1;while(roster.some(p=>p.name===`Player ${n}`))n++;roster.push({id:uid(),name:`Player ${n}`});persist();render();}break;
      case 'remove':if(roster.length>3){roster=roster.filter(p=>p.id!==b.dataset.id);config.parasites=Math.min(config.parasites,roster.length-1);delete config.assignments[b.dataset.id];config.overrides=config.overrides.filter(o=>o.player!==b.dataset.id);persist();render();}break;
      case 'less':config.parasites=Math.max(1,config.parasites-1);markCustom();render();break;
      case 'more':config.parasites=Math.min(roster.length-1,config.parasites+1);markCustom();render();break;
      case 'preset':applyPreset(b.dataset.id);break;
      case 'settings':settings();break;
      case 'settings-tab':error='';settings(b.dataset.tab);break;
      case 'presets':settings('presets');break;
      case 'help':if(view==='playing'){revealed=false;render();}help();break;
      case 'close-modal':closeModal();break;
      case 'settings-done':closeModal();persist();render();break;
      case 'start':
        E.createGame(roster,config);
        if(audioPrefs.enabled)void music.start();
        if(game&&game.phase!=='ended')openModal('Replace the current game?',`<p class="muted">A game is already in progress. Starting a new briefing replaces it.</p><div class="modal-foot">${button('Keep current game','close-modal','btn secondary')}${button('New game','replace-game')}</div>`,'replace');
        else newGame();break;
      case 'replace-game':closeModal();newGame();break;
      case 'resume':if(audioPrefs.enabled)void music.start();view='playing';resetPrivate();render();break;
      case 'leave':closeModal();view='setup';resetPrivate();persist();render();break;
      case 'conceal':closeModal();revealed=false;render();break;
      case 'reveal':
        if(game.phase==='operations'){
          const turn=E.prepareTurn(game);if(jointGate&&turn.operation==='encounter'&&!turn.done){E.runOperation(game);persist();}
        }
        revealed=true;render();break;
      case 'brief-next':game.cursor++;if(game.cursor>=game.players.length)E.finishBriefing(game);privateAdvance();break;
      case 'round-start':E.startRound(game);privateAdvance();break;
      case 'target':{
        const id=b.dataset.id,limit=Number(b.dataset.limit);selected=selected.includes(id)?selected.filter(t=>t!==id):limit===1?[id]:selected.length<limit?[...selected,id]:[...selected.slice(1),id];render();break;
      }
      case 'choice':choice=b.dataset.choice;render();break;
      case 'operate':{
        const turn=E.prepareTurn(game);
        if(turn.operation==='encounter'){jointGate=true;revealed=false;render();break;}
        E.runOperation(game,{targets:selected,choice});persist();
        if(turn.operation==='confession'){jointGate=true;revealed=false;}
        render();window.scrollTo(0,0);break;
      }
      case 'op-next':E.finishTurn(game);if(game.phase==='discussion')setTimer();privateAdvance();break;
      case 'timer-toggle':if(!game.timer)setTimer();if(game.timer.running){game.timer.remaining=remainingTime();game.timer.running=false;}else{if(!remainingTime())game.timer.remaining=game.config.discussionMinutes*60;game.timer.deadline=Date.now()+game.timer.remaining*1000;game.timer.running=true;}persist();render();break;
      case 'timer-reset':setTimer();persist();render();break;
      case 'voting-start':E.startVoting(game);privateAdvance();break;
      case 'cast-vote':if(selected.length!==1)throw new Error('Choose a player first.');E.vote(game,selected[0]);privateAdvance();break;
      case 'final-results':game.phase='ended';privateAdvance();break;
      case 'play-again':game=null;view='setup';privateAdvance();break;
      case 'game-overrides':resetPrivate();overridesDraft=null;gameOverrides();break;
      case 'overrides-cancel':overridesDraft=null;closeModal();break;
      case 'overrides-save':E.validateRound(overridesDraft,game.round+1,E.active(game));game.config.overrides=E.clone(overridesDraft.overrides);overridesDraft=null;closeModal();persist();render();toast('Round overrides saved');break;
      case 'override-add':{
        const cfg=modalMode==='game-overrides'?overridesDraft:config;const people=modalMode==='game-overrides'?E.active(game):roster;
        cfg.overrides.push({round:modalMode==='game-overrides'?game.round+1:1,player:people[0].id,operation:'tip',result:'',targets:[]});
        if(modalMode==='game-overrides')gameOverrides();else{markCustom();settings('manual');}break;
      }
      case 'override-remove':{const cfg=modalMode==='game-overrides'?overridesDraft:config;cfg.overrides.splice(Number(b.dataset.index),1);if(modalMode==='game-overrides')gameOverrides();else{markCustom();settings('manual');}break;}
      case 'save-custom':{
        const name=$('preset-name').value.trim();if(!name)throw new Error('Name your configuration first.');
        const existing=customs.find(p=>p.name.toLowerCase()===name.toLowerCase());
        if(existing){openModal('Update saved configuration?',`<p>Replace the saved settings for <strong>${esc(name)}</strong> with your current configuration?</p><div class="modal-foot">${button('Cancel','presets','btn secondary')}${button('Update','overwrite-custom','btn',`data-id="${esc(existing.id)}"`)}</div>`,'overwrite');}
        else{const item={id:uid(),name,config:E.clone(config),roster:E.clone(roster)};customs.push(item);presetId=item.id;persist();settings('presets');render();toast('Configuration saved');}break;
      }
      case 'overwrite-custom':{const item=find(customs,b.dataset.id);item.config=E.clone(config);item.roster=E.clone(roster);presetId=item.id;persist();settings('presets');render();toast('Configuration updated');break;}
      case 'load-custom':{
        const p=find(customs,b.dataset.id);config=E.cleanConfig(p.config);if(p.roster)roster=E.clone(p.roster);presetId=p.id;persist();settings('presets');render();toast(p.name+' loaded');break;
      }
      case 'delete-custom':openModal('Delete saved configuration?',`<p>Delete <strong>${esc(find(customs,b.dataset.id).name)}</strong> from this browser?</p><div class="modal-foot">${button('Cancel','presets','btn secondary')}${button('Delete','confirm-delete','btn danger',`data-id="${esc(b.dataset.id)}"`)}</div>`,'delete');break;
      case 'confirm-delete':customs=customs.filter(p=>p.id!==b.dataset.id);if(presetId===b.dataset.id)presetId='custom';persist();settings('presets');render();break;
      case 'export':{
        const body={format:'quadruple-agent-config',version:1,name:find(customs,presetId)?.name||find(C.presets,presetId)?.name||'Custom',roster,config};
        const url=URL.createObjectURL(new Blob([JSON.stringify(body,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='quadruple-agent-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Configuration exported');break;
      }
      case 'import':$('config-file').click();break;
    }
  }
  document.addEventListener('click',event=>{
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;
    error='';try{runAction(b.dataset.action,b);}catch(err){error=err.message||'Something went wrong.';if(modal.open){if(modalMode==='game-overrides')gameOverrides();else if(modalMode==='settings')settings(modalTab);else toast(error);}else render();}
  });
  document.addEventListener('input',event=>{
    const t=event.target;
    if(t.dataset.name){const p=roster.find(p=>p.id===t.dataset.name);if(p)p.name=t.value;persist();}
    if(t.dataset.config==='discussionMinutes'){config.discussionMinutes=Math.max(0,Math.min(30,Number(t.value)||0));markCustom();}
    if(t.dataset.config==='operationPhases'){config.operationPhases=Math.max(1,Math.min(10,Math.floor(Number(t.value)||1)));markCustom();}
  });
  document.addEventListener('change',async event=>{
    const t=event.target;
    if(t.dataset.config&&t.type==='checkbox'){config[t.dataset.config]=t.checked;markCustom();if(t.dataset.config==='manual')settings('manual');render();}
    if(t.dataset.list){const key=t.dataset.list;config[key]=t.checked?[...new Set([...config[key],t.dataset.id])]:config[key].filter(id=>id!==t.dataset.id);markCustom();render();}
    if(t.dataset.assignment){const a=config.assignments[t.dataset.id]||(config.assignments[t.dataset.id]={});a[t.dataset.assignment]=t.value;markCustom();}
    if(t.dataset.override){
      const cfg=modalMode==='game-overrides'?overridesDraft:config,o=cfg.overrides[Number(t.dataset.index)],field=t.dataset.override;
      if(field.startsWith('target')){o.targets=o.targets||[];o.targets[Number(field.slice(6))]=t.value;}
      else if(field==='round')o.round=Math.max(modalMode==='game-overrides'?game.round+1:1,Math.min(999,Math.floor(Number(t.value)||1)));
      else{o[field]=t.value;if(field==='operation'){o.targets=[];o.result='';}if(field==='player'&&!find(C.operations,o.operation)?.allowSelf)o.targets=(o.targets||[]).map(id=>id===o.player?'':id);}
      if(modalMode==='game-overrides')gameOverrides();else{markCustom();settings('manual');}
    }
    if(t.id==='config-file'&&t.files?.[0]){
      try{
        if(t.files[0].size>1024*1024)throw new Error('The configuration file is too large.');
        const incoming=JSON.parse(await t.files[0].text());
        if(incoming.format!=='quadruple-agent-config'||incoming.version!==1||!Array.isArray(incoming.roster)||incoming.roster.length<3||incoming.roster.length>9||!incoming.config)throw new Error('Choose a Quadruple Agent configuration export.');
        const nextRoster=incoming.roster.map(p=>({id:String(p.id).slice(0,100),name:String(p.name).slice(0,30)}));
        if(nextRoster.some(p=>!p.id||!p.name)||new Set(nextRoster.map(p=>p.id)).size!==nextRoster.length)throw new Error('The file contains invalid player entries.');
        config=E.cleanConfig(incoming.config);roster=nextRoster;presetId='custom';persist();settings('presets');render();toast('Configuration imported');
      }catch(err){toast(err.message||'Unable to read that file.');}
    }
  });
  modal.addEventListener('close',()=>{overridesDraft=null;error='';});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&view==='playing'){revealed=false;if(modal.open)modal.close();render();persist();}});
  window.addEventListener('pagehide',()=>{if(view==='playing'){revealed=false;render();}persist();});
  window.addEventListener('pageshow',event=>{if(event.persisted&&view==='playing'){revealed=false;render();}});
  setInterval(()=>{if(view==='playing'&&game?.phase==='discussion'&&$('timer')){$('timer').textContent=timerText();if(game.timer?.running&&remainingTime()===0){game.timer.running=false;game.timer.remaining=0;persist();render();}}},500);
  // Expose public setup through WebMCP, never secret allegiances or individual votes.
  if(document.modelContext?.registerTool){try{const lifecycle=new AbortController();window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});Promise.resolve(document.modelContext.registerTool({name:'read_quadruple_agent_setup',title:'Read game setup',description:'Read public setup and enabled operations without secret game state.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(input&&Object.keys(input).length)throw new Error('This tool accepts no input fields.');return {title:'Quadruple Agent',players:roster.map(p=>p.name),startingParasites:config.parasites,parityVictory:config.parity,operations:config.operations.map(id=>find(C.operations,id).name)};}},{signal:lifecycle.signal})).catch(()=>{});}catch{}}
  persist();render();
})();

</script>
